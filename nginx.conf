worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name talarc.ru www.talarc.ru;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name talarc.ru www.talarc.ru;
        root /usr/share/nginx/html;
        index index.html;

        ssl_certificate /etc/letsencrypt/live/talarc.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/talarc.ru/privkey.pem;

        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # Пустая главная страница
        location = / {
            try_files /index.html =404;
        }

        # DateArc приложение
        location /datearc {
            alias /usr/share/nginx/html/datearc;
            try_files $uri $uri/ /datearc/index.html;

            location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # API прокси
        location /api/yandex/suggest {
            set $yandex_suggest suggest-maps.yandex.ru;
            proxy_pass https://$yandex_suggest/v1/suggest?apikey=8f0c155f-8213-40c9-bf65-ae7a4fabcef4&$args;
            proxy_set_header Host suggest-maps.yandex.ru;
            proxy_ssl_server_name on;
        }

        location /api/yandex/geocode {
            set $yandex_geocode geocode-maps.yandex.ru;
            proxy_pass https://$yandex_geocode/v1/?apikey=8f0c155f-8213-40c9-bf65-ae7a4fabcef4&$args;
            proxy_set_header Host geocode-maps.yandex.ru;
            proxy_ssl_server_name on;
        }

        # Email subscribe API
        location /api/subscribe {
            proxy_pass http://127.0.0.1:3001/subscribe;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Email list (admin)
        location /api/emails {
            proxy_pass http://127.0.0.1:3001/emails;
            proxy_set_header Host $host;
        }

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1000;
    }
}

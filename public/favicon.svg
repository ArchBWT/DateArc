<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Black background -->
  <rect width="512" height="512" fill="#000000" rx="80"/>

  <!-- Stylized italic A — left diagonal thick stroke (parallelogram) -->
  <polygon points="60,460 148,460 308,52 220,52" fill="#ffffff"/>

  <!-- Right leg of A — curves down to a hook -->
  <!-- Right diagonal stroke -->
  <polygon points="220,52 308,52 388,272 300,272" fill="#ffffff"/>

  <!-- Hook bottom of right leg going right-down -->
  <path d="M300,272 L388,272 L388,360 Q388,400 350,400 L320,400 Q310,400 310,390 L310,370 Q310,360 320,360 L340,360 Q350,360 350,350 L350,272 L300,272 Z" fill="#ffffff"/>

  <!-- 4-pointed star at bottom-right -->
  <path d="
    M 385,390
    C 385,390 370,418 355,430
    C 370,442 385,470 385,470
    C 385,470 400,442 415,430
    C 400,418 385,390 385,390 Z
  " fill="#ffffff"/>
  <path d="
    M 355,430
    C 355,430 382,415 395,430
    C 382,445 355,430 355,430 Z
  " fill="#ffffff"/>
  <path d="
    M 335,428
    C 335,428 365,415 385,430
    C 365,445 335,432 335,428 Z
  " fill="#ffffff"/>
  <path d="
    M 415,428
    C 415,428 385,415 365,430
    C 385,445 415,432 415,428 Z
  " fill="#ffffff"/>

  <!-- Better 4-pointed star using clean path -->
  <g transform="translate(370, 418)">
    <path d="M 0,-52 C 0,-52 -10,-10 -52,0 C -10,0 0,52 0,52 C 0,52 10,10 52,0 C 10,0 0,-52 0,-52 Z" fill="#ffffff" transform="scale(0.72)"/>
  </g>
</svg>